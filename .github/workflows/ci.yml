name: Remnant CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Lint release-track modules
        run: >-
          python -m ruff check
          remnant/__init__.py remnant/claims.py remnant/config.py remnant/context.py
          remnant/db.py remnant/extract.py remnant/ingest.py remnant/maintenance.py
          remnant/prefetch.py remnant/resolve.py
      - name: Build wheel and sdist
        run: python -m build
