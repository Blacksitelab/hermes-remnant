[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-remnant"
version = "0.1.0"
description = "Memory engine plugin for Hermes Agent fleet"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "watchfiles>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["remnant"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Ensure the worktree's own `remnant` package takes precedence over any
# editable install pointing at a different checkout/worktree.
pythonpath = ["."]
